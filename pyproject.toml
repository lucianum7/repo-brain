[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-brain"
version = "0.4.0"
description = "Persistent repository memory for coding agents — Codex, Claude Code and MCP."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Lucianum7"}]
keywords = ["ai", "coding-agents", "codex", "claude-code", "mcp", "sqlite", "agent-memory"]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2.0,<3"]
dev = ["pytest>=8", "build>=1", "ruff>=0.16.6"]

[project.scripts]
repo-brain = "repo_brain.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
repo_brain = ["migrations/*.sql", "templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
